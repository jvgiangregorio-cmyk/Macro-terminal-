name: Probe bond yield sources (temporary)
on:
  push:
    branches: [claude/project-thread-ep0enn]
    paths: ["probe/**", ".github/workflows/probe-yields.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 probe/finnhub_probe.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
