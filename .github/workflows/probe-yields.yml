name: Probe bond yield sources (temporary)
on:
  push:
    branches: [claude/project-thread-ep0enn]
    paths: ["probe/**", ".github/workflows/probe-yields.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python probe/yields_probe.py
