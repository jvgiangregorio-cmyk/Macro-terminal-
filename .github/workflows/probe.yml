name: probe (temporary)
on:
  push:
    branches: [claude/fundamentals]
    paths: [scripts/probe.py, scripts/fundamentals.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals
          path: out/fundamentals.json
